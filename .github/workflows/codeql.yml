# CodeQL: GitHub's code scanning, over floorboss's JavaScript on every push and pull request and once a week.
# It reads the code and uploads findings to the repository's Security tab; it can't push, tag or release. Every
# action is pinned to a full commit.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 5 * * 3'

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Read its own run's details (needed in a private repository).
      actions: read
      # Upload the findings to the repository's code-scanning page.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
