# OpenSSF Scorecard: grades how the repository is run (branch protection, pinned actions, signed releases,
# token permissions) and publishes the result for the badge in the README. It reads the repository; it can't
# push, tag or release. Every action is pinned to a full commit. The scorecard action itself runs a container
# that its own action file names by tag (ghcr.io/ossf/scorecard-action:v2.5.0), which the commit pin doesn't
# fix: this job is kept apart, with no write access to the code, so the worst that image could do is upload a
# wrong report.
name: scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Upload the results to the repository's code-scanning page.
      security-events: write
      # Publish the results to the OpenSSF for the badge.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
